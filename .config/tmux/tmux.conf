# =====================================================================
# tmux.conf — minimal, beginner-friendly setup
# macOS + Ghostty + Neovim (vim-tmux-navigator) + zsh/starship
# Themed to Catppuccin Frappé to match nvim + starship.
# =====================================================================

# ---------------------------------------------------------------------
# Prefix: Ctrl-a instead of default Ctrl-b (easier reach).
# Ctrl-a collides with zsh/readline "beginning of line" — press
# Ctrl-a twice to send a literal Ctrl-a through when you need it.
# ---------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind a send-prefix

# ---------------------------------------------------------------------
# General usability
# ---------------------------------------------------------------------
set -g mouse on
set -g set-clipboard on
set -g history-limit 10000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -sg escape-time 10        # crucial for Neovim: avoids <Esc> input lag
set -g focus-events on

setw -g mode-keys vi

# ---------------------------------------------------------------------
# True color / italics (so catppuccin renders correctly).
# Ghostty (TERM=xterm-ghostty) advertises RGB via its terminfo, so tmux
# auto-detects truecolor; the RGB feature below makes it explicit. The
# xterm-256color override is kept for other terminals (e.g. iTerm2).
# ---------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm-ghostty:RGB"

# ---------------------------------------------------------------------
# Extended keys — let modified keys (Shift+Enter, Ctrl+Enter, etc.)
# pass through to apps like Claude Code. Without this, tmux strips the
# modifier and Shift+Enter arrives as a plain Enter (submits instead of
# inserting a newline). Requires an outer terminal that supports CSI-u /
# modifyOtherKeys (Ghostty does).
# ---------------------------------------------------------------------
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ---------------------------------------------------------------------
# Splits: intuitive keys, open in the current pane's directory
# ---------------------------------------------------------------------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"   # prefix + |  -> vertical split
bind '\' split-window -h -c "#{pane_current_path}" # prefix + \  -> same, no Shift needed
bind - split-window -v -c "#{pane_current_path}"   # prefix + -  -> horizontal split
bind c new-window -c "#{pane_current_path}"        # prefix + c  -> new window, same cwd

# ---------------------------------------------------------------------
# Pane resizing (prefix + H/J/K/L, repeatable)
# ---------------------------------------------------------------------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------------------------------------------------------------------
# Reload config
# ---------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# =====================================================================
# vim-tmux-navigator: seamless Ctrl-h/j/k/l between tmux panes and
# Neovim splits. Verbatim from christoomey/vim-tmux-navigator README.
# =====================================================================
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# =====================================================================
# status bar
# =====================================================================

# Configure the catppuccin plugin
set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "rounded"

# Window label: show the pane title (#T) when it's meaningful — e.g.
# Claude Code advertises "Claude Code" — but fall back to the running
# program (#{pane_current_command}) when the title is empty or just the
# machine hostname (*.local), which nvim/zsh emit and isn't useful.
# Must be set before catppuccin loads (it uses set -o = only-if-unset).
set -g @catppuccin_window_text " #{?#{||:#{m:*.local,#{pane_title}},#{==:#{pane_title},}},#{pane_current_command},#{pane_title}}"
set -g @catppuccin_window_current_text " #{?#{||:#{m:*.local,#{pane_title}},#{==:#{pane_title},}},#{pane_current_command},#{pane_title}}"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -Fg 'status-format[1]' '#{status-format[0]}'
set -gF 'status-format[0]' '#[fill=#{@thm_bg}]'
set -g status 2

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

run ~/.config/tmux/plugins/tmux-cpu/cpu.tmux
run ~/.config/tmux/plugins/tmux-battery/battery.tmux

